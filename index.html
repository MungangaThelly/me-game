<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <meta name="description" content="A memory card game with multiple local modes, themes, and offline support" />
    <meta name="theme-color" content="#3498db" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Memory Game Pro" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Memory Game Pro</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- Hidden Install Button -->
    <button id="installBtn" style="display: none; position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; z-index: 1000;">
      Install App
    </button>

    <!-- Main JS entry -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Scripts -->
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Handle install prompt
      let deferredPrompt;
      const installBtn = document.getElementById('installBtn');

      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent auto-prompt
        e.preventDefault();
        deferredPrompt = e;

        // Show the install button
        if (installBtn) {
          installBtn.style.display = 'block';
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', () => {
          installBtn.style.display = 'none';

          if (deferredPrompt) {
            deferredPrompt.prompt();

            deferredPrompt.userChoice.then((choiceResult) => {
              if (choiceResult.outcome === 'accepted') {
                console.log('User accepted the install prompt');
              } else {
                console.log('User dismissed the install prompt');
              }
              deferredPrompt = null;
            });
          }
        });
      }

      // Hide install button if already installed
      window.addEventListener('appinstalled', () => {
        console.log('PWA was installed');
        if (installBtn) {
          installBtn.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
